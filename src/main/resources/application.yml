server:
  port: 8080
  compression:
    enabled: true

spring:
  application:
    name: todo-app
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximumPoolSize: '20'
      minimumIdle: '10'
      idleTimeout: '60000'
      maxLifetime: '1800000'
      connectionTimeout: '30000'
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: 'classpath:schema.sql'
  mail:
    host: ${MAIL_HOST:smtp.servidor-correo.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
#        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

app:
  frontend-url: ${FRONTEND_URL:http://localhost:*}
  mail-from: ${MAIL_FROM:info@full4media.com}
  secure-cookie: false
  version: ${APP_VERSION:0.2.5}
  cache:
    whitelist:
      ttl: ${WHITELIST_CACHE_TTL:PT60S}
      maximum-size: ${WHITELIST_CACHE_MAX_SIZE:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${APP_VERSION:0.2.5}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}

rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:5}
  refill-minutes: ${RATE_LIMIT_REFILL_MINUTES:1}

swagger:
  base-url: "http://localhost:8080"

---
spring:
  config:
    activate:
      on-profile: "prod"
  datasource:
    url: jdbc:postgresql://api-postgres-db:5432/postgres
    username: ${POSTGRES_API_USER}
    password: ${POSTGRES_API_PASSWORD}

swagger:
  base-url: "https://api.casa.full4media.com"

app:
  frontend-url: "https://todo.full4media.com"
  mail-from: ${MAIL_FROM}
  secure-cookie: true
