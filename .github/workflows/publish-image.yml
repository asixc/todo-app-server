name: build-and-push

on:
  push:
    branches: [feature/auth]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
      actions: read
    env:
      REGISTRY: registry.full4media.com
      IMAGE_NAME: apps/todo-app-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from pom.xml
        id: version
        run: |
          VERSION=$(mvn -B -ntp -q help:evaluate -DforceStdout -Dexpression=project.version 2>/dev/null | tail -1)
          SHORT_SHA=${GITHUB_SHA::7}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build application
        run: ./mvnw -B -ntp package -DskipTests

      - name: Login to Zot registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.version.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: 'table'
          output: 'trivy-report.txt'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
          exit-code: '0'

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: 'sarif'
          output: 'trivy-report.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
          exit-code: '0'

      - name: Upload Trivy table report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ steps.version.outputs.version }}
          path: trivy-report.txt
          retention-days: 30

      - name: Upload Trivy SARIF report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif-${{ steps.version.outputs.version }}
          path: trivy-report.sarif
          retention-days: 30

      - name: Upload Trivy report to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-report.sarif
          category: trivy-image-scan

      - name: Update gitops-config deployment
        if: success()
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short_sha }}"
          IMAGE="registry.full4media.com/apps/todo-app-server:${VERSION}"
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/asixc/gitops-config.git" /tmp/gitops
          cd /tmp/gitops
          sed -i "s|image: registry.full4media.com/apps/todo-app-server:.*|image: ${IMAGE}|" \
            apps/base/todo-app/api-deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/base/todo-app/api-deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(todo-app-api): bump image to ${VERSION} (sha-${SHORT_SHA})"
            git push
          fi
